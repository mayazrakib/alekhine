name: CI
on:
    push:
    pull_request:
permissions:
    contents: read
jobs:
    verify:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
              with:
                  version: '0.12.10'
                  python-version: '3.14.7'
            - name: Install Rust Toolchain
              run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
            - name: Initialize
              run: uv sync --locked
            - name: Test
              run: uv run --locked python tools/scripts/build.py --test
            - name: Build
              run: uv run --locked python tools/scripts/build.py
