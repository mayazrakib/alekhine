version: '3'

tasks:
    default:
        desc: Display available tasks.
        cmds:
            - task --list
    help:
        desc: Describe available project tasks.
        cmds:
            - task --list
    init:
        desc: Initialize the development environment.
        cmds:
            - "uv sync --locked"
    test:
        desc: Execute automated tests.
        cmds:
            - "uv run --locked python tools/scripts/build.py --test"
    build:
        desc: Build project artifacts.
        cmds:
            - "uv run --locked python tools/scripts/build.py"
